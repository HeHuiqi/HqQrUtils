<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HQ 二维码生成与识别工具箱 (Chrome Extension)</title>
    <!-- 基础与通用样式模块 -->
    <link rel="stylesheet" href="common/css/variables.css">
    <link rel="stylesheet" href="common/css/base.css">
    <link rel="stylesheet" href="common/css/header.css">
    <link rel="stylesheet" href="common/css/panels.css">
    <link rel="stylesheet" href="common/css/preview.css">
    <link rel="stylesheet" href="common/css/history.css">
    <link rel="stylesheet" href="common/css/toast.css">
</head>
<body class="theme-light">
    <!-- 全局 Toast 通知容器 -->
    <div id="toastContainer" class="toast-container"></div>

    <div class="app-container">
        <!-- 顶部 Header 导航栏 -->
        <header class="app-header">
            <div class="brand">
                <svg class="logo-icon" width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="2" width="28" height="28" rx="8" fill="#2563EB"/>
                    <rect x="7" y="7" width="7" height="7" rx="1.5" fill="#FFFFFF"/>
                    <rect x="18" y="7" width="7" height="7" rx="1.5" fill="#FFFFFF"/>
                    <rect x="7" y="18" width="7" height="7" rx="1.5" fill="#FFFFFF"/>
                    <circle cx="19.5" cy="19.5" r="1.5" fill="#FFFFFF"/>
                    <circle cx="23.5" cy="19.5" r="1.5" fill="#FFFFFF"/>
                    <circle cx="19.5" cy="23.5" r="1.5" fill="#FFFFFF"/>
                    <circle cx="23.5" cy="23.5" r="1.5" fill="#FFFFFF"/>
                </svg>
                <div class="brand-text">
                    <h1>HQ 二维码与工具箱</h1>
                    <span class="sub-title">Chrome 扩展版 · 本地存储保护</span>
                </div>
            </div>
            <div class="header-actions">
                <span class="storage-badge" title="数据使用 chrome.storage.local 安全存储">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                    扩展安全存储
                </span>
                <button id="themeToggleBtn" class="icon-btn" title="切换深色/浅色主题">
                    <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 主内容区域：三栏响应式网格 -->
        <main class="main-layout">
            <!-- 左侧：模式选择与表单卡片 -->
            <section class="panel-card input-panel">
                <div class="mode-tabs">
                    <button id="tabGenerate" class="tab-btn active" type="button">生成二维码</button>
                    <button id="tabDecode" class="tab-btn" type="button">识别二维码</button>
                </div>

                <div id="generatorSection" class="generator-section">
                    <div class="template-chips">
                        <span class="chip-label">快捷模板:</span>
                        <button class="chip" data-preset="url">网址 URL</button>
                        <button class="chip" data-preset="wifi">Wi-Fi 连接</button>
                        <button class="chip" data-preset="text">纯文本</button>
                        <button class="chip" data-preset="contact">名片 (vCard)</button>
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label for="qrContentInput">二维码内容 <span class="required">*</span></label>
                            <span id="charCounter" class="char-counter">字符数: 0</span>
                        </div>
                        <textarea id="qrContentInput" placeholder="输入任意文本、网页 URL、Wi-Fi 配置或名片信息..." rows="4"></textarea>
                        <button id="clearContentBtn" class="clear-btn" title="清空内容" type="button">&times;</button>
                    </div>

                    <div class="form-actions">
                        <button id="generateBtn" class="btn btn-primary">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="7" height="7"/>
                                <rect x="14" y="3" width="7" height="7"/>
                                <rect x="3" y="14" width="7" height="7"/>
                                <path d="M14 14h3v3h-3z"/>
                            </svg>
                            生成并保存记录
                        </button>
                        <button id="resetFormBtn" class="btn btn-secondary">重置选项</button>
                    </div>

                    <div class="form-group margin-top-sm">
                        <label for="qrTitleInput">记录备注标题 (可选)</label>
                        <input type="text" id="qrTitleInput" placeholder="例如：公司官网 / 房间Wi-Fi" maxlength="40">
                    </div>

                    <div class="form-group inline category-select-group">
                        <label for="categorySelect">所属分类标签</label>
                        <select id="categorySelect" class="small-select">
                            <option value="none">无标签</option>
                            <option value="work">💼 工作</option>
                            <option value="personal">👤 个人</option>
                            <option value="network">📶 网络</option>
                            <option value="test">🧪 测试</option>
                        </select>
                    </div>

                    <details class="advanced-settings">
                        <summary>
                            <span>高级外观样式与 Logo 设置</span>
                            <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"/>
                            </svg>
                        </summary>
                        <div class="settings-grid">
                            <div class="form-group full-width">
                                <label>中心 Logo 图标 (可选)</label>
                                <div class="logo-upload-box">
                                    <button id="uploadLogoBtn" class="btn btn-outline small" type="button">选择 Logo 图片</button>
                                    <span id="logoFileName" class="sub-text">未选择图片</span>
                                    <button id="removeLogoBtn" class="text-btn danger" style="display: none;" type="button">移除</button>
                                    <input type="file" id="logoFileInput" accept="image/*" style="display: none;">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="fgColorInput">前景色 (点阵)</label>
                                <div class="color-picker-wrapper">
                                    <input type="color" id="fgColorInput" value="#0f172a">
                                    <input type="text" id="fgHexInput" value="#0f172a" maxlength="7">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="bgColorInput">背景颜色</label>
                                <div class="color-picker-wrapper">
                                    <input type="color" id="bgColorInput" value="#ffffff">
                                    <input type="text" id="bgHexInput" value="#ffffff" maxlength="7">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="eclSelect" title="纠错等级越高，损坏或覆盖Logo时越容易识别">
                                    纠错等级 (ECL)
                                </label>
                                <select id="eclSelect">
                                    <option value="L">L (7% 容错率)</option>
                                    <option value="M" selected>M (15% 容错率)</option>
                                    <option value="Q">Q (25% 容错率)</option>
                                    <option value="H">H (30% 容错率)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <div class="label-row">
                                    <label for="cellSizeInput">点阵尺寸</label>
                                    <span id="cellSizeVal" class="val-tag">8px</span>
                                </div>
                                <input type="range" id="cellSizeInput" min="3" max="16" value="8">
                            </div>

                            <div class="form-group">
                                <div class="label-row">
                                    <label for="marginInput">留白边距 (Quiet Zone)</label>
                                    <span id="marginVal" class="val-tag">4</span>
                                </div>
                                <input type="range" id="marginInput" min="0" max="10" value="4">
                            </div>
                        </div>
                    </details>
                </div>

                <div id="decoderSection" class="decoder-section" style="display: none;">
                    <div class="camera-control-bar">
                        <button id="toggleCameraBtn" class="btn btn-outline" type="button">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                                <circle cx="12" cy="13" r="4"/>
                            </svg>
                            <span id="cameraBtnText">开启摄像头扫描</span>
                        </button>
                    </div>

                    <div id="cameraViewport" class="camera-viewport" style="display: none;">
                        <video id="cameraVideo" autoplay playsinline muted></video>
                        <div class="scanner-overlay">
                            <div class="scanner-frame">
                                <div class="scanner-line"></div>
                            </div>
                        </div>
                        <button id="closeCameraBtn" class="close-camera-btn" title="关闭摄像头" type="button">&times;</button>
                    </div>

                    <div class="drop-zone" id="dropZone">
                        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <path d="M7 7h3v3H7z"/>
                            <path d="M14 7h3v3h-3z"/>
                            <path d="M7 14h3v3H7z"/>
                            <polyline points="14 17 17 14 20 17"/>
                            <line x1="17" y1="14" x2="17" y2="20"/>
                        </svg>
                        <p>点击上传或拖拽二维码图片到此处</p>
                        <span class="sub-text">支持快捷键 Ctrl+V / Cmd+V 粘贴图片识别</span>
                        <input type="file" id="decodeFileInput" accept="image/*" style="display: none;">
                    </div>

                    <div id="decodeResultCard" class="decode-result-card" style="display: none;">
                        <div class="result-header">
                            <span class="badge badge-primary">识别文本内容</span>
                            <span id="decodeTimeTag" class="meta-tag">刚刚</span>
                        </div>
                        <textarea id="decodeResultText" readonly rows="3"></textarea>
                        <div class="result-actions">
                            <button id="copyDecodeTextBtn" class="btn btn-primary" type="button">复制文本</button>
                            <button id="openDecodeUrlBtn" class="btn btn-success" type="button" style="display: none;">打开链接</button>
                            <button id="transferToEditBtn" class="btn btn-outline" type="button">导入生成器</button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="panel-card preview-panel">
                <div class="panel-header">
                    <h2>实时二维码预览</h2>
                    <span id="activeRecordTag" class="active-tag">新建生成</span>
                </div>

                <div id="qrViewport" class="qr-viewport">
                    <div id="qrCanvasContainer" class="canvas-container">
                        <div id="emptyPreview" class="empty-state">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <path d="M7 7h3v3H7z"/>
                                <path d="M14 7h3v3h-3z"/>
                                <path d="M7 14h3v3H7z"/>
                            </svg>
                            <p>输入内容后自动呈现二维码 preview</p>
                        </div>
                    </div>

                    <div id="qrMetaInfo" class="qr-meta-info" style="display: none;">
                        <span id="metaSizeTag">尺寸: --</span>
                        <span id="metaEclTag">容错率: --</span>
                        <span id="metaTimeTag">时间: --</span>
                    </div>
                </div>

                <div class="export-actions">
                    <button id="downloadPngBtn" class="btn btn-primary" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        下载 PNG
                    </button>
                    <button id="downloadSvgBtn" class="btn btn-outline" disabled>下载 SVG</button>
                    <button id="copyImageBtn" class="btn btn-outline" disabled>复制图片</button>
                    <button id="copyTextBtn" class="btn btn-outline" disabled>复制文本</button>
                </div>
            </section>

            <section class="panel-card history-panel">
                <div class="panel-header">
                    <h2>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                        历史生成记录
                    </h2>
                    <div class="history-actions-top">
                        <button id="clearHistoryBtn" class="text-btn danger" title="清空全部历史记录">清空</button>
                    </div>
                </div>

                <div class="category-chips" id="categoryFilterBar">
                    <button class="cat-chip active" data-cat="all">全部</button>
                    <button class="cat-chip" data-cat="favorite">⭐ 收藏</button>
                    <button class="cat-chip" data-cat="work">💼 工作</button>
                    <button class="cat-chip" data-cat="personal">👤 个人</button>
                    <button class="cat-chip" data-cat="network">📶 网络</button>
                    <button class="cat-chip" data-cat="test">🧪 测试</button>
                </div>

                <div class="search-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" id="historySearchInput" placeholder="搜索历史内容或备注标题...">
                    <button id="clearSearchBtn" class="clear-search-btn" style="display: none;">&times;</button>
                </div>

                <div class="history-list-wrapper">
                    <div id="historyList" class="history-list"></div>
                    <div id="emptyHistory" class="empty-history">
                        <p>暂无历史生成记录</p>
                        <span class="sub-text">在左侧输入并“生成”后将自动记录到此处</span>
                    </div>
                </div>

                <div class="history-footer">
                    <span id="historyCountText">已保存 0 条记录</span>
                    <button id="exportHistoryBtn" class="btn-link">导出 JSON</button>
                    <span class="divider">|</span>
                    <button id="importHistoryBtn" class="btn-link">导入 JSON</button>
                    <input type="file" id="importFileInput" accept=".json" style="display: none;">
                </div>
            </section>
        </main>
    </div>

    <!-- 依赖库与通用业务模块 (在扩展根目录下统一相对路径) -->
    <script src="common/lib/qrcode.min.js"></script>
    <script src="common/lib/jsqr.min.js"></script>
    <script src="common/js/storage-adapter.js"></script>
    <script src="common/js/qr-engine.js"></script>
    <script src="common/js/ui-toast.js"></script>
    <script src="common/js/ui-history.js"></script>
    <!-- Extension 专用应用控制器 -->
    <script src="js/app-ext.js"></script>
</body>
</html>
