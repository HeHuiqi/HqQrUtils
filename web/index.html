<!--
  HQ 二维码生成工具 - Web 端主入口 (Source Template)
  提示：本文件依赖 common/ 目录下的 CSS、JS 与第三方库资源。
  运行与测试请执行脚本进行构建: bash build_script/build_web.sh (产物位于 build/web/)
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self';">
    <meta name="description" content="功能强大的在线二维码生成工具，支持自定义颜色、容错率，自动本地保存生成记录，点击记录可再次显示与编辑。">
    <title>二维码生成器 - 支持本地记录与历史回显</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-light">
    <div class="app-container">
        <!-- 头部 Navigation / Header -->
        <header class="app-header">
            <div class="header-brand">
                <div class="brand-logo">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
                        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
                        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
                        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
                        <circle cx="16" cy="16" r="0.75" fill="currentColor" stroke="none"/>
                        <circle cx="19" cy="16" r="0.75" fill="currentColor" stroke="none"/>
                        <circle cx="16" cy="19" r="0.75" fill="currentColor" stroke="none"/>
                        <circle cx="19" cy="19" r="0.75" fill="currentColor" stroke="none"/>
                    </svg>
                </div>
                <h1 class="brand-title">二维码生成器</h1>
            </div>

            <div class="header-actions">
                <span class="storage-badge" id="storageStatus" title="本地数据存储状态">
                    <span id="historyCountText">已保存 0 条记录</span>
                </span>

                <button id="themeToggleBtn" class="icon-btn" title="切换深色/浅色主题" aria-label="切换主题">
                    <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 主内容区 Main Layout -->
        <main class="main-layout">
            <!-- 左侧：输入与设置区域 -->
            <section class="panel-card generator-panel">
                <div class="panel-header">
                    <div class="mode-tabs">
                        <button id="tabGenerate" class="tab-btn active" type="button">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"/>
                                <line x1="5" y1="12" x2="19" y2="12"/>
                            </svg>
                            生成二维码
                        </button>
                        <button id="tabDecode" class="tab-btn" type="button">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                            识别二维码
                        </button>
                    </div>
                </div>

                <!-- 1. 生成模式 View -->
                <div id="generatorSection" class="generator-section">
                    <!-- 模板预设按钮 -->
                    <div class="preset-chips">
                        <span class="preset-label">快捷模板:</span>
                        <button class="chip" data-preset="url">🌐 网址</button>
                        <button class="chip" data-preset="wifi">📶 Wi-Fi</button>
                        <button class="chip" data-preset="text">📝 纯文本</button>
                        <button class="chip" data-preset="contact">👤 名片</button>
                    </div>

                    <!-- 文本内容输入框 -->
                    <div class="form-group">
                        <label for="qrContentInput">二维码文本或链接内容 <span class="required">*</span></label>
                        <div class="textarea-wrapper">
                            <textarea id="qrContentInput" placeholder="请输入任意文本、网址链接或字符..." rows="3"></textarea>
                            <button id="clearContentBtn" class="clear-input-btn" title="清空内容" type="button">&times;</button>
                        </div>
                        <div class="input-hint">
                            <span id="charCounter">字符数: 0</span>
                            <span>自动实时预览</span>
                        </div>
                    </div>

                    <!-- 操作按钮：直接放在输入框的下面 -->
                    <div class="form-actions">
                        <button id="generateBtn" class="btn btn-primary">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                            </svg>
                            生成并保存记录
                        </button>
                        <button id="resetFormBtn" class="btn btn-secondary">重置选项</button>
                    </div>

                    <!-- 备注标题与分类选择 -->
                    <div class="form-group margin-top-sm">
                        <label for="qrTitleInput">记录备注标题 (可选)</label>
                        <input type="text" id="qrTitleInput" placeholder="例如：公司官网 / 房间Wi-Fi" maxlength="40">
                    </div>

                    <div class="form-group inline category-select-group">
                        <label for="categorySelect">所属分类标签</label>
                        <select id="categorySelect" class="small-select">
                            <option value="none">无标签</option>
                            <option value="work">💼 工作</option>
                            <option value="personal">👤 个人</option>
                            <option value="network">📶 网络</option>
                            <option value="test">🧪 测试</option>
                        </select>
                    </div>

                    <!-- 展开高级设置面板 -->
                    <details class="advanced-settings">
                        <summary>
                            <span>🎨 样式与高级参数设置</span>
                            <svg class="chevron-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"/>
                            </svg>
                        </summary>

                        <div class="settings-grid">
                            <!-- 前景色 -->
                            <div class="form-group inline">
                                <label for="fgColorInput">前景色 (点阵)</label>
                                <div class="color-picker-wrapper">
                                    <input type="color" id="fgColorInput" value="#0f172a">
                                    <input type="text" id="fgHexInput" class="hex-text" value="#0f172a">
                                </div>
                            </div>

                            <!-- 背景色 -->
                            <div class="form-group inline">
                                <label for="bgColorInput">背景色</label>
                                <div class="color-picker-wrapper">
                                    <input type="color" id="bgColorInput" value="#ffffff">
                                    <input type="text" id="bgHexInput" class="hex-text" value="#ffffff">
                                </div>
                            </div>

                            <!-- 容错率 -->
                            <div class="form-group">
                                <label for="eclSelect">纠错等级 (ECL)</label>
                                <select id="eclSelect">
                                    <option value="L">L - 7% 容错 (小尺寸/高密文本)</option>
                                    <option value="M" selected>M - 15% 容错 (推荐标准)</option>
                                    <option value="Q">Q - 25% 容错 (较高抗损毁)</option>
                                    <option value="H">H - 30% 容错 (最高容错)</option>
                                </select>
                            </div>

                            <!-- 点阵大小 -->
                            <div class="form-group">
                                <label for="cellSizeInput">点阵尺寸: <span id="cellSizeVal">8px</span></label>
                                <input type="range" id="cellSizeInput" min="3" max="16" value="8" step="1">
                            </div>

                            <!-- 中心 Logo 图片 -->
                            <div class="form-group full-width">
                                <label for="logoFileInput">中心 Logo 图标 (可选)</label>
                                <div class="logo-upload-row">
                                    <input type="file" id="logoFileInput" accept="image/*" style="display:none;">
                                    <button id="uploadLogoBtn" class="btn btn-outline small" type="button">
                                        🖼️ 上传 Logo 图片
                                    </button>
                                    <span id="logoFileName" class="logo-file-name">未选择图片</span>
                                    <button id="removeLogoBtn" class="clear-input-btn" title="移除 Logo" type="button" style="display:none;">&times;</button>
                                </div>
                            </div>

                            <!-- 边距 -->
                            <div class="form-group full-width">
                                <label for="marginInput">留白边距 (Quiet Zone): <span id="marginVal">4</span></label>
                                <input type="range" id="marginInput" min="0" max="10" value="4" step="1">
                            </div>
                        </div>
                    </details>
                </div>

                <!-- 2. 解码识别模式 View -->
                <div id="decoderSection" class="decoder-section" style="display: none;">
                    <!-- 摄像头扫描控制条 -->
                    <div class="camera-control-bar">
                        <button id="toggleCameraBtn" class="btn btn-outline" type="button">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                                <circle cx="12" cy="13" r="4"/>
                            </svg>
                            <span id="cameraBtnText">开启摄像头扫描</span>
                        </button>
                    </div>

                    <!-- 摄像头视频渲染视口 (默认隐藏) -->
                    <div id="cameraViewport" class="camera-viewport" style="display: none;">
                        <video id="cameraVideo" autoplay playsinline muted></video>
                        <div class="scanner-overlay">
                            <div class="scanner-frame">
                                <div class="scanner-line"></div>
                            </div>
                        </div>
                        <button id="closeCameraBtn" class="close-camera-btn" title="关闭摄像头" type="button">&times;</button>
                    </div>

                    <!-- 拖拽/点击文件上传区 -->
                    <div class="drop-zone" id="dropZone">
                        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <path d="M7 7h3v3H7z"/>
                            <path d="M14 7h3v3h-3z"/>
                            <path d="M7 14h3v3H7z"/>
                            <polyline points="14 17 17 14 20 17"/>
                            <line x1="17" y1="14" x2="17" y2="20"/>
                        </svg>
                        <p>点击上传或拖拽二维码图片到此处</p>
                        <span class="sub-text">支持快捷键 Ctrl+V / Cmd+V 粘贴图片识别</span>
                        <input type="file" id="decodeFileInput" accept="image/*" style="display: none;">
                    </div>

                    <!-- 识别出的结果展示框 -->
                    <div id="decodeResultCard" class="decode-result-card" style="display: none;">
                        <div class="result-header">
                            <span class="badge badge-primary">识别文本内容</span>
                            <span id="decodeTimeTag" class="meta-tag">刚刚</span>
                        </div>
                        <textarea id="decodeResultText" readonly rows="3"></textarea>
                        <div class="result-actions">
                            <button id="copyDecodeTextBtn" class="btn btn-primary" type="button">复制文本</button>
                            <button id="openDecodeUrlBtn" class="btn btn-success" type="button" style="display: none;">打开链接</button>
                            <button id="transferToEditBtn" class="btn btn-outline" type="button">导入生成器</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 中间/右侧：当前二维码展示区 -->
            <section class="panel-card preview-panel">
                <div class="panel-header">
                    <h2>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        二维码预览
                    </h2>
                    <span class="active-record-tag" id="activeRecordTag">新建生成</span>
                </div>

                <div class="preview-viewport">
                    <div id="qrCanvasContainer" class="qr-container">
                        <!-- Canvas 或 SVG 动态生成注入位置 -->
                        <div class="empty-preview" id="emptyPreview">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <path d="M7 7h3v3H7z"/>
                                <path d="M14 7h3v3h-3z"/>
                                <path d="M7 14h3v3H7z"/>
                                <path d="M14 14h3v3h-3z"/>
                            </svg>
                            <p>输入内容或点击左侧/历史记录生成二维码</p>
                        </div>
                    </div>

                    <!-- 动态尺寸与信息展示 -->
                    <div class="qr-meta-info" id="qrMetaInfo" style="display: none;">
                        <span class="meta-tag" id="metaSizeTag">尺寸: -</span>
                        <span class="meta-tag" id="metaEclTag">容错: -</span>
                        <span class="meta-tag" id="metaTimeTag">生成时间: -</span>
                    </div>
                </div>

                <!-- 导出与复制快捷工具栏 -->
                <div class="preview-actions" id="previewActions">
                    <button id="downloadPngBtn" class="btn btn-success" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        下载 PNG
                    </button>
                    <button id="downloadSvgBtn" class="btn btn-outline" disabled>
                        下载 SVG
                    </button>
                    <button id="copyImageBtn" class="btn btn-outline" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                        复制图片
                    </button>
                    <button id="copyTextBtn" class="btn btn-outline" disabled>
                        复制文本
                    </button>
                </div>
            </section>

            <!-- 右侧：本地历史记录列表 -->
            <section class="panel-card history-panel">
                <div class="panel-header">
                    <h2>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                        历史生成记录
                    </h2>
                    <div class="history-actions-top">
                        <button id="clearHistoryBtn" class="text-btn danger" title="清空全部历史记录">清空</button>
                    </div>
                </div>

                <!-- 历史分类标签筛选芯片 -->
                <div class="category-chips" id="categoryFilterBar">
                    <button class="cat-chip active" data-cat="all">全部</button>
                    <button class="cat-chip" data-cat="favorite">⭐ 收藏</button>
                    <button class="cat-chip" data-cat="work">💼 工作</button>
                    <button class="cat-chip" data-cat="personal">👤 个人</button>
                    <button class="cat-chip" data-cat="network">📶 网络</button>
                    <button class="cat-chip" data-cat="test">🧪 测试</button>
                </div>

                <!-- 历史搜索栏 -->
                <div class="search-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" id="historySearchInput" placeholder="搜索历史文本或标题...">
                    <button id="clearSearchBtn" class="clear-search-btn" style="display: none;">&times;</button>
                </div>

                <!-- 历史记录滚动列表 -->
                <div class="history-list-wrapper">
                    <div id="historyList" class="history-list">
                        <!-- JS 动态渲染列表项 -->
                    </div>
                    <!-- 历史记录为空的占位 -->
                    <div class="empty-history" id="emptyHistory" style="display: none;">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 8v4l3 3"/>
                            <circle cx="12" cy="12" r="9"/>
                        </svg>
                        <p>暂无保存的历史记录</p>
                        <span class="sub-text">点击“生成并保存记录”即可自动记录至本地</span>
                    </div>
                </div>

                <!-- 导入与导出操作 -->
                <div class="history-footer">
                    <button id="exportHistoryBtn" class="btn-link">导出数据 (.json)</button>
                    <span class="divider">|</span>
                    <button id="importHistoryBtn" class="btn-link">导入数据</button>
                    <input type="file" id="importFileInput" accept=".json" style="display: none;">
                </div>
            </section>
        </main>

        <!-- 全局 Toast 消息提示框 -->
        <div id="toastContainer" class="toast-container" aria-live="polite"></div>
    </div>

    <!-- 依赖库与功能模块 -->
    <script src="lib/qrcode.min.js"></script>
    <script src="lib/jsqr.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/qr-engine.js"></script>
    <script src="js/ui-toast.js"></script>
    <script src="js/ui-history.js"></script>
    <!-- 主应用控制器 -->
    <script src="js/app.js"></script>
</body>
</html>
