name: HqQrUtils
options:
  bundleIdPrefix: com.hq.qrutils
  deploymentTarget:
    iOS: 15.0
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  PRODUCT_NAME: HqQrUtils
  PRODUCT_BUNDLE_IDENTIFIER: com.hq.qrutils.ios
  DEVELOPMENT_TEAM: ""
  MARKETING_VERSION: 1.1.0
  CURRENT_PROJECT_VERSION: 1
  GENERATE_INFOPLIST_FILE: NO
  SWIFT_VERSION: "5.0"
  ENABLE_BITCODE: NO
  TARGETED_DEVICE_FAMILY: "1,2"
  ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
  ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO

targets:
  HqQrUtils:
    type: application
    platform: iOS
    deploymentTarget: 15.0
    sources:
      - path: Sources/HqQrUtils
      - path: Assets.xcassets
      - path: Resources/public
        type: folder
    settings:
      INFOPLIST_FILE: Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
      ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
      LD_RUNPATH_STARTUP_TRANSLATION: "$(inherited)"
      PRODUCT_BUNDLE_IDENTIFIER: com.hq.qrutils.ios
      SWIFT_OBJC_BRIDGING_HEADER: Sources/HqQrUtils/HqQrUtils-Bridging-Header.h
      OTHER_LDFLAGS: $(inherited) -lsqlite3
      HEADER_SEARCH_PATHS: "$(SDKROOT)/usr/include"
      OTHER_SWIFT_FLAGS: "$(inherited) -suppress-warnings"
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: Vision.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: WebKit.framework
      - sdk: UIKit.framework
      - sdk: Foundation.framework

